<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Capture beforeinstallprompt sedini mungkin, sebelum React mount -->
    <script>
      window.__exoraInstallEvent = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__exoraInstallEvent = e;
        window.dispatchEvent(new CustomEvent('exora-install-ready'));
      });
    </script>
    <title>Exora — Buka Toko Online Gratis</title>
    <meta name="description" content="Platform toko online gratis untuk semua. Buka toko, jual produk, dan terima pesanan via WhatsApp." />
    <link rel="canonical" href="https://myexora.com/" />
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://myexora.com" />
    <meta property="og:title" content="Exora — Buka Toko Online Gratis" />
    <meta property="og:description" content="Platform toko online gratis untuk semua. Buka toko, jual produk, dan terima pesanan via WhatsApp." />
    <meta property="og:image" content="https://myexora.com/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Exora" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Exora — Buka Toko Online Gratis" />
    <meta name="twitter:description" content="Platform toko online gratis untuk semua. Buka toko, jual produk, dan terima pesanan via WhatsApp." />
    <meta name="twitter:image" content="https://myexora.com/og-default.png" />
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Exora",
      "url": "https://myexora.com",
      "logo": "https://myexora.com/icons/icon-192.png",
      "description": "Platform toko online gratis untuk semua. Buka toko, jual produk, dan terima pesanan via WhatsApp."
    }
    </script>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#5b8af5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Exora" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
